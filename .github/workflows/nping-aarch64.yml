
name: nping-aarch64
on:
  workflow_dispatch:
env:
  TZ: Asia/Shanghai
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: nmap/nmap
        ref: master

    - name: 安装 aarch64 交叉编译器
      run: |
        sudo timedatectl set-timezone "Asia/Shanghai"
        # 使用 Ubuntu 官方 apt 源，100% 可用，无任何第三方依赖
        sudo apt-get update -qq
        sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
        aarch64-linux-gnu-gcc -v

    - name: 编译 nping
      run: |
        export CC="aarch64-linux-gnu-gcc -static"
        export CXX="aarch64-linux-gnu-g++ -static"
        export CFLAGS="-O2"
        export CXXFLAGS="-O2"
        export LDFLAGS="-O2 -static"
        sed -i 's|-L\. \$(SHAREDLIBV)|\$(TEST_LIBS)|g' ./libz/Makefile.in
        ./configure --host=aarch64-linux-gnu --enable-static --disable-shared \
          --without-ncat --with-nping --without-localdirs --without-ndiff --without-zenmap --without-nmap
        make -j$(nproc)
        file nping/nping

    - name: Strip 并压缩
      run: |
        mkdir -p /opt/nping
        aarch64-linux-gnu-strip nping/nping
        cp nping/nping /opt/nping/nping
        sudo apt-get install -y -qq upx-ucl 2>/dev/null || sudo apt-get install -y -qq upx 2>/dev/null || true
        cp /opt/nping/nping /opt/nping/nping_upx
        upx --lzma --best /opt/nping/nping_upx 2>/dev/null || echo "UPX压缩跳过"
        ls -alh /opt/nping/

    - uses: actions/upload-artifact@v4
      with:
        name: nping-aarch64
        path: /opt/nping/

    - name: 发布 Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        DATE_TAG=$(date '+%Y-%m-%d')
        BUILD_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
        TAG_NAME="nping-aarch64-${SHORT_HASH}"
        RELEASE_NAME="nping-aarch64-${SHORT_HASH}_${DATE_TAG}"
        BODY="**目标架构: aarch64 (ARM64)** — 适用于高通骁龙410等 Cortex-A53 OpenWrt 设备

        编译时间: ${BUILD_TIME}

        编译方式: aarch64-linux-gnu-gcc 静态链接

        [源码提交](https://github.com/nmap/nmap/tree/$(git rev-parse HEAD))

        **-upx** 后缀为 UPX 压缩版"

        gh release create "$TAG_NAME" /opt/nping/* \
          --title "$RELEASE_NAME" \
          --notes "$BODY"
