name: nping-aarch64
on:
  workflow_dispatch:
env:
  TZ: Asia/Shanghai
#设置仓库的读写权限
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: nmap/nmap
        ref: master #默认使用master分支
    - name: 删除记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 0
        keep_minimum_runs: 0
    - name: 下载gcc
      uses: lmq8267/dl-musl@main
      with:
        target: aarch64-linux-musl
        static: true
        gccpath: /tmp

    - name: 编译
      run: |
         sudo timedatectl set-timezone "Asia/Shanghai"
         aarch64-linux-musl-gcc -v
         export CC="$CC -static"
         export CXX="$CXX -static"
         export CFLAGS="-O2 $CFLAGS"
         export CXXFLAGS="-O2 $CXXFLAGS"
         export LDFLAGS="-O2 $LDFLAGS"
         sed -i 's|-L\. \$(SHAREDLIBV)|\$(TEST_LIBS)|g' ./libz/Makefile.in
         # 关键修改：启用nping并禁用其他组件
         ./configure --host=aarch64-linux-musl --enable-static --disable-shared --without-ncat --with-nping --without-localdirs --without-ndiff --without-zenmap --without-nmap
         make
         # 验证编译结果
         file nping/nping
         mkdir -p /opt/nping
         aarch64-linux-musl-strip nping/nping
         mv nping/nping /opt/nping/
         # 环境变量设置
         echo "build_time=$(TZ=Asia/Shanghai date '+%Y年%m月%d日%H:%M:%S' | jq -sRr @uri)" >> $GITHUB_ENV
         echo "date_time=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
         echo "haxi=$(git rev-parse HEAD)" >> $GITHUB_ENV
         echo "short_haxi=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
    - name: 安装 UPX
      uses: crazy-max/ghaction-upx@v3
      with:
        version: v4.2.4
        install-only: true
    - name: 压缩
      run: |
         cd /opt/nping
         for file in /opt/nping/*; do
          if [ -f "$file" ]; then
            file $file
            cp "$file" "${file}_upx"
          fi
         done
         ls -alh
         for file in /opt/nping/*_upx; do
          if [ -f "$file" ]; then
            echo "压缩 $file"
            ls -alh $file
            upx --lzma --best "$file"
            ls -alh $file
          fi
         done
    - uses: actions/upload-artifact@v4
      with:
        name: nping-aarch64
        path: /opt/nping/
    - name: 发布
      uses: softprops/action-gh-release@v2
      with:
          token: ${{ github.token }}
          body: |
             > ### ![](https://img.shields.io/badge/%E7%BC%96%E8%AF%91%E6%97%B6%E9%97%B4-${{ env.build_time }}-8267?logo=github&labelColor=%E9%A1%BB)![](https://img.shields.io/github/downloads/${{ github.repository }}/${{ env.short_haxi }}/total?label=%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&logo=github)

              **目标架构: aarch64 (ARM64)** — 适用于高通骁龙410等 Cortex-A53 设备

              [当前版本编译时的提交记录](https://github.com/nmap/nmap/tree/${{ env.haxi }}) 如需最新的，请fork后手动触发执行编译流程
              
              **-upx** 后缀的 为upx压缩文件
              
              **[官方仓库](https://github.com/nmap/nmap)**
              
          tag_name: nping-aarch64-${{ env.short_haxi }}
          name: nping-aarch64-${{ env.short_haxi }}_${{ env.date_time }}
          files: /opt/nping/*
